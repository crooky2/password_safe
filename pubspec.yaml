name: password_safe
description: "An lightweight password manager built with Flutter."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.2+3

msix_config:
  display_name: Password Safe
  identity_name: crooky.PasswordSafeWindows
  publisher: CN=CA72CBB8-2F17-4B02-9FE8-944D53AAF8B3
  publisher_display_name: crooky
  msix_version: 1.1.2.0
  store: true
  install_certificate: false

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.0
  shared_preferences: ^2.5.5
  oauth2_client: ^4.2.0
  http: ^1.2.2
  local_auth: ^3.0.1
  msix: ^3.16.13
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  inno_bundle: ^0.11.2

flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/png/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

inno_bundle:
  id: 6bfe55d0-5b44-11f1-bfd8-59b53481673e
  publisher: chris
